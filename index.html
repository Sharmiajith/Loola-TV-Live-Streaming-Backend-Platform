<!DOCTYPE html>
<html>
<head>
    <title>Loola TV Streaming</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
        }

        .container {
            width: 450px;
            margin: 40px auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px #ccc;
        }

        h1 {
            color: #8b00ff;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border-radius: 7px;
            border: 1px solid #333;
        }

        button {
            margin-top: 15px;
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        #connect {
            background: #8b00ff;
            color: white;
        }

        #startCamera {
            background: green;
            color: white;
        }

        #stopCamera {
            background: #999;
            color: white;
        }

        #video {
            width: 100%;
            height: 240px;
            background: black;
            margin-top: 15px;
            border-radius: 7px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Loola Live Streaming</h1>

    <label>RTMP URL</label>

    <input
        type="text"
        id="rtmpUrl"
        placeholder="rtmp://..."
    >

    <label>Stream Key</label>

    <input
        type="password"
        id="streamKey"
        placeholder="Enter Loola Stream Key"
    >

    <button id="connect">
        Connect Loola
    </button>

    <h3>Camera Preview</h3>

    <video id="video" autoplay muted></video>

    <button id="startCamera">
        Start Camera
    </button>

    <button id="stopCamera">
        Stop Camera
    </button>

    <br>

    <button id="startLive">
        Start Live
    </button>

    <button id="stopLive">
        Stop Live
    </button>

</div>

<script src="/static/app.js"></script>

</body>
</html>
